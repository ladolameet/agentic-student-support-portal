services:
  - type: web
    name: student-support-agent
    env: python
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt && python scripts/initialize_db.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: MAX_STEPS
        value: 5
      - key: GROQ_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: college-policy-vectorless-rag
